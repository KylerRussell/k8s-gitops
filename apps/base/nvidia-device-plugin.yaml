apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/KylerRussell/k8s-gitops.git
    targetRevision: main
    path: apps/manifests/nvidia-device-plugin
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-device-plugin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    # CreateNamespace is deliberately NOT set here. The namespace ships as a
    # manifest so it is created with its Pod Security Admission labels already
    # in place -- letting Argo CD create a bare namespace first would leave a
    # window in which the DaemonSet's pods are rejected by PSA.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
