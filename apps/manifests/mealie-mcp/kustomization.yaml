apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mealie-mcp
resources:
  - mcp-token-sealedsecret.yaml
  - mealie-token-sealedsecret.yaml
  - deployment.yaml
  - service.yaml
# The hash suffix on the generated ConfigMap rolls the Deployment whenever
# server.py or requirements.txt changes.
configMapGenerator:
  - name: mealie-mcp-app
    files:
      - server.py
      - requirements.txt
