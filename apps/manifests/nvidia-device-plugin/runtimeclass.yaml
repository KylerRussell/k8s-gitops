# Maps the `nvidia` RuntimeClass onto the containerd handler that the
# nvidia-container-toolkit system extension registers on the node.
#
# Any pod that needs a GPU must set `runtimeClassName: nvidia`, including the
# device plugin itself. Without it containerd uses the default runtime and no
# GPU devices are injected into the container.
#
# RuntimeClass is cluster-scoped, so it is not namespaced by the kustomization.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
