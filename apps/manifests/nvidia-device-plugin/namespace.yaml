apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-device-plugin
  labels:
    # The cluster enforces PodSecurity `baseline` with `restricted` for audit
    # and warn (see cluster.apiServer.admissionControl in the Talos machine
    # config); only kube-system is exempt.
    #
    # The device plugin must mount /var/lib/kubelet/device-plugins from the
    # host to register itself with the kubelet, and `baseline` forbids
    # hostPath volumes. Verified by server-side dry-run of a bare Pod:
    #
    #   forbidden: violates PodSecurity "baseline:latest":
    #   hostPath volumes (volume "device-plugin")
    #
    # Note that applying the DaemonSet alone only produces a warning --
    # PodSecurity enforces on Pods, not on workload controllers, so a clean
    # `kubectl apply --dry-run=server` of the DaemonSet proves nothing.
    #
    # The hostPath is the ONLY reason the exemption is needed. The container
    # itself still runs unprivileged with all capabilities dropped.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
