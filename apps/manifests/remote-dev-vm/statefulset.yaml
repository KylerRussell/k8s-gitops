apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: remote-dev-vm
  namespace: remote-dev-vm
  labels:
    app: remote-dev-vm
spec:
  serviceName: remote-dev-vm
  replicas: 1
  selector:
    matchLabels:
      app: remote-dev-vm
  template:
    metadata:
      labels:
        app: remote-dev-vm
    spec:
      containers:
        - name: webtop
          securityContext:
            privileged: true
            runAsUser: 0
            seccompProfile:
              type: Unconfined
          command: ["/bin/bash", "-c"]
          # Grants kasm-user passwordless sudo, then starts the desktop.
          #
          # This used to begin with `apt-get update && apt-get install -y sudo`.
          # The image ships ~10 third-party apt repos, and once HashiCorp's
          # signing key stopped validating, `apt-get update` exited 100 and the
          # pod crash-looped before the desktop ever started.
          #
          # sudo is already in kasmweb/ubuntu-jammy-desktop:1.16.0, so apt is
          # only a fallback now. When it does run, it reads Ubuntu's own
          # sources.list and skips the third-party repos. A failure there only
          # costs sudo; it no longer keeps the desktop from starting.
          args:
            - |
              if ! command -v sudo >/dev/null; then
                echo "sudo missing -- installing from Ubuntu's archive only"
                apt-get update -o Dir::Etc::SourceParts=/dev/null \
                  && apt-get install -y sudo \
                  || echo "WARNING: could not install sudo; starting desktop without it"
              fi
              if command -v sudo >/dev/null; then
                echo "kasm-user ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/kasm-user
                chmod 0440 /etc/sudoers.d/kasm-user
              fi
              exec runuser -u kasm-user -- /dockerstartup/vnc_startup.sh /dockerstartup/kasm_startup.sh --tail-log
          image: kasmweb/ubuntu-jammy-desktop:1.16.0
          imagePullPolicy: IfNotPresent
          env:
            - name: VNC_PW
              value: "password"
            - name: VNC_USER
              value: "kasm_user"
            - name: VNC_LISTENING_PORT
              value: "-1"
          ports:
            - containerPort: 6901
              name: https
              protocol: TCP
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          readinessProbe:
            tcpSocket:
              port: 6901
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6901
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "4000m"
              memory: "16Gi"
            limits:
              cpu: "16000m"
              memory: "32Gi"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 50Gi
