apiVersion: v1
kind: Namespace
metadata:
  name: claude-code-vm
  labels:
    # Matches remote-dev-vm. The Kasm desktop image needs a privileged
    # container to start its VNC stack, which PodSecurity `baseline` forbids.
    #
    # This is inherited from the existing remote-dev-vm pattern rather than
    # justified from first principles -- worth revisiting whether the desktop
    # actually needs full privilege, since this namespace now also holds both
    # GPUs and a large share of the cluster's memory.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
