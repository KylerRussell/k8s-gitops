apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claude-code-vm
  namespace: claude-code-vm
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "claude-code-vm"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # Auto-login, matching remote-dev-vm. Decodes to kasm_user:password and
    # must stay in step with VNC_PW in statefulset.yaml -- if the two drift,
    # the desktop falls back to showing a login page.
    #
    # This pre-authenticates every request that reaches the ingress. See the
    # note on VNC_PW in statefulset.yaml for the exposure this implies.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Authorization "Basic a2FzbV91c2VyOnBhc3N3b3Jk";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - claude-code.homelab.com
      secretName: claude-code-vm-tls
  rules:
    - host: claude-code.homelab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claude-code-vm
                port:
                  number: 3000
