apiVersion: v1
kind: Service
metadata:
  name: home-dns
  annotations:
    # Shares 192.168.86.240 with the ingress (ports 80/443): no new LAN IP
    # needed, and the MetalLB pool overlaps the router's DHCP range.
    metallb.io/loadBalancerIPs: 192.168.86.240
    metallb.io/allow-shared-ip: homelab-240
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: home-dns
  ports:
    - name: dns
      port: 53
      targetPort: dns
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
