# Strategic merge patch -- APPLY TO THE CONTROL PLANE NODE ONLY.
#
# Fix 6: labels the GPU node so the NVIDIA device plugin DaemonSet has
#        something to select on.
#
# Without this the DaemonSet would land on the GPU-less workers too, where
# the plugin cannot find a device and crash-loops.
#
# Declaring the label in the Talos machine config (rather than with
# `kubectl label`) keeps it declarative and survives a node rebuild.
#
# nodeLabels is a map, so strategic merge adds this key without disturbing
# the existing exclude-from-external-load-balancers label.
#
# If the label does not appear on the node after applying, kubelet's
# NodeRestriction admission may be rejecting the prefix -- fall back to
# selecting on `kubernetes.io/hostname: talos-7j9-1pq` in the DaemonSet.
machine:
  nodeLabels:
    nvidia.com/gpu.present: "true"
