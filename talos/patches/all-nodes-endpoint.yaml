# Strategic merge patch -- APPLY TO ALL THREE NODES.
#
# Fix 1: cluster.controlPlane.endpoint currently points at 192.168.86.26,
#        an IP that is assigned to nothing. The cluster only survives this
#        because kubePrism (127.0.0.1:7445) gives in-cluster components a
#        local endpoint. Repoint it at the new control plane VIP.
#
# Fix 3: machine.install.image is the stock installer, which carries NO
#        system extensions -- an upgrade with it would silently drop
#        iscsi-tools and break Longhorn. Repoint it at the Image Factory
#        installer built from talos/schematic.yaml.
#
# Both fields are scalars, so strategic merge replaces them cleanly.
#
# The schematic ID below is the one registered from talos/schematic.yaml.
# It is deterministic: re-registering the same schematic returns the same ID.
# If you change the extension list, re-register and update this reference.
#
# WARNING: Talos does NOT validate the image reference on apply. It accepts
# any string -- including a stale or misspelled schematic ID -- without error
# and writes it into the config, where it only fails at upgrade time.
cluster:
  controlPlane:
    endpoint: https://192.168.86.230:6443
machine:
  install:
    image: factory.talos.dev/installer/f53e88768342a2fd9d590e037332c5fcd709d8fd80aa7db6c326f81a43227bf4:v1.9.5
